# /etc/nginx/sites-available/umkm-desa
# ln -s /etc/nginx/sites-available/umkm-desa /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name umkm.example.com;  # ganti dengan domain Anda

    client_max_body_size 5m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Setelah DNS siap, aktifkan HTTPS (wajib untuk PWA):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d umkm.example.com
