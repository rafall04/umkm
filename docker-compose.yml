services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: umkm_desa
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Hanya bind ke loopback — jangan expose Postgres ke jaringan publik
      # (komposisi default compose dipakai juga di server produksi).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
